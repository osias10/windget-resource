name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out the release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verify the tag matches the application version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string]([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          . ./build/version.ps1
          $versionInfo = Get-ReleaseVersionInfo -Version $version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "The release tag must equal v followed by Directory.Build.props Version ($version)."
          }
          "RELEASE_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV
          "RELEASE_PRERELEASE=$($versionInfo.IsPrerelease.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build, test, and package the self-contained application
        run: ./build/build.ps1

      - name: Locate or install Inno Setup 6
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $candidates | Where-Object {
            (Test-Path -LiteralPath $_ -PathType Leaf) -and
            ([Diagnostics.FileVersionInfo]::GetVersionInfo($_).FileMajorPart -eq 6)
          } | Select-Object -First 1
          if (-not $compiler) {
            $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
            $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $expected) {
              throw 'Inno Setup download failed SHA256 verification.'
            }
            $destination = Join-Path $env:RUNNER_TEMP 'inno-setup-6'
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
              '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', '/TASKS=', ('/DIR="' + $destination + '"'))
            $process = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              throw 'Inno Setup extraction timed out.'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) { throw "Inno Setup extraction failed: $($process.ExitCode)." }
            $compiler = Join-Path $destination 'ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'ISCC.exe is missing.' }
          "ISCC_PATH=$compiler" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build the Windows installer
        run: ./build/build-installer.ps1 -IsccPath $env:ISCC_PATH

      - name: Validate installation, installed application, and uninstallation
        run: ./build/test-installer.ps1

      - name: Prepare checksums and release notes
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $files = @(
            ".artifacts/ResourceStatus-$version-win-x64-setup.exe",
            ".artifacts/ResourceStatus-$version-win-x64.zip"
          )
          $checksums = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content -LiteralPath .artifacts/SHA256SUMS.txt -Encoding utf8
          $smokeFiles = @(Get-ChildItem -LiteralPath .artifacts/validation -Filter smoke.json -Recurse)
          if ($smokeFiles.Count -ne 1) { throw 'Expected exactly one application UI smoke report.' }
          $smoke = Get-Content -LiteralPath $smokeFiles[0].FullName -Raw | ConvertFrom-Json
          if ($smoke.success -ne $true) { throw 'The application UI smoke report did not pass.' }
          $rendering = if ($smoke.renderingAvailable) {
            'UI bitmap 렌더링 검사를 포함했습니다.'
          } else {
            'CI 데스크톱에서 렌더링을 사용할 수 없어 bitmap 화면 검사는 제외했습니다.'
          }
          $notes = @"
          Windows 11 x64용 시스템 리소스 위젯 v$version 릴리즈입니다.

          - **설정 → 색상 알림** 추가: CPU·RAM·GPU·네트워크별 사용 여부와 주황·빨강 기준값을 설정하며 두 위젯 크기가 공유
          - 기본 사용률 80% 이상은 주황색, 95% 이상은 빨간색으로 사용률 숫자·게이지·그래프 구간에 적용
          - 사용률이 내려갈 때 최대 3%p의 복귀 여유를 적용해 경계에서 색이 반복해서 바뀌는 현상 방지
          - 네트워크는 링크 사용률로 색을 판단하며 송수신 속도에도 적용: 그래프 수신은 실선, 송신은 점선으로 구분
          - 기준값 변경 시 보관 중인 그래프에도 반영하며 측정 불가 구간과 기존 표시 설정은 유지
          - **설치:** ResourceStatus-$version-win-x64-setup.exe 실행
          - **포터블:** ResourceStatus-$version-win-x64.zip 전체 압축 해제 후 ResourceStatus.exe 실행

          .NET 런타임이 포함되어 있어 별도 설치가 필요 없습니다. SHA256SUMS.txt로 다운로드 파일의 해시를 확인할 수 있습니다.

          v0.0.2 이상 사용자는 앱의 업데이트 확인 → 다운로드 → 설치하고 다시 시작을 사용할 수 있습니다. v0.0.1 사용자는 이번 설치 파일로 한 번 업데이트해 주세요. 기존 설정과 위젯 위치는 유지되며 색상 알림은 기본으로 켜집니다. 설정에서 항목별로 끌 수 있습니다.

          빌드·코어 테스트·UI 검사 $($smoke.assertionCount)개와 설치·설치된 앱 실행·제거 검증을 통과했습니다. $rendering 색상 경계·복귀 기준·설정 저장·두 크기의 표시·그래프 구간과 미측정 공백을 자동 검증했습니다.

          이 초기 배포본에는 코드 서명이 없어 Windows에서 게시자 확인 경고가 표시될 수 있습니다.
          "@
          $notes | Set-Content -LiteralPath .artifacts/release-notes.md -Encoding utf8
          $notes | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          $assets = @(
            ".artifacts/ResourceStatus-$version-win-x64-setup.exe",
            ".artifacts/ResourceStatus-$version-win-x64.zip",
            '.artifacts/SHA256SUMS.txt'
          )
          $existing = & gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw "Release $tag is already published. Published assets will not be overwritten."
            }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            & gh release edit $tag --title "ResourceStatus $tag" --notes-file .artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
          } else {
            & gh release create $tag @assets --draft --verify-tag --title "ResourceStatus $tag" --notes-file .artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          $releaseJson = & gh release view $tag --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify uploaded release assets.' }
          $uploaded = ($releaseJson | ConvertFrom-Json).assets
          foreach ($path in $assets) {
            $local = Get-Item -LiteralPath $path
            $remote = @($uploaded | Where-Object name -CEQ $local.Name)
            if ($remote.Count -ne 1 -or $remote[0].size -ne $local.Length) {
              throw "Uploaded asset verification failed: $($local.Name). The release remains a draft."
            }
          }
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            & gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            & gh release edit $tag --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the verified draft release failed.' }
          & gh release view $tag --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the published release URL.' }
